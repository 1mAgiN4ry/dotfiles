#-Animations---------------------
transition-length = 0
transition-pow-x = 0.1
transition-pow-y = 0.1
transition-pow-w = 0.1
transition-pow-h = 0.1
size-transition = false


#-Corners------------------------
#corner-radius = 5.0;
rounded-corners-exclude = [
  # "window_type = 'normal'",
  # "class_g = 'Polybar'",
];

round-borders = 1;
round-borders-exclude = [
  # "class_g = 'Polybar'",
];


#-Shadows------------------------
shadow = false;
shadow-radius = 12;
shadow-opacity = 0.85;
shadow-offset-x = -12;
shadow-offset-y = -12;
# shadow-red = 0;
# shadow-green = 0;
# shadow-blue = 0;
shadow-exclude = [
  # "name= 'Notification'",
  # "class_g = 'Polybar'",
];


#-Fading-------------------------
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [
];


#-Transparency-------------------
inactive-opacity = 1;
frame-opacity = 1;
active-opacity = 1;
focus-exclude = [
];

opacity-rule = [
];


#-Blur---------------------------
blur-background = false;
