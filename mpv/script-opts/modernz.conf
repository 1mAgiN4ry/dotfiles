# ModernZ v0.3.3 play bar (scripts/modernz.lua), Gruvbox themed.
# Only overrides are listed; every other option keeps ModernZ's default.
# Thumbnails on seekbar hover come from scripts/thumbfast.lua.

# awesome manages the window, so no title bar / window buttons
window_top_bar=no

# Keep the bar the same size whatever the window size
# (adjust with scalewindowed / scalefullscreen if it's too big or small)
vidscale=no

# Background and text
osc_color=#1d2021
title_color=#ebdbb2
time_color=#ebdbb2
chapter_title_color=#ebdbb2
cache_info_color=#ebdbb2
side_buttons_color=#ebdbb2
middle_buttons_color=#ebdbb2
playpause_color=#ebdbb2
held_element_color=#928374
thumbnail_box_color=#1d2021

# Seekbar (Gruvbox orange accent)
seekbarfg_color=#fe8019
seekbarbg_color=#665c54
seekbar_cache_color=#928374
seek_handle_color=#d65d0e
seek_handle_border_color=#fe8019
hover_effect_color=#fe8019
nibble_color=#fe8019
nibble_current_color=#ebdbb2
ab_loop_color=#83a598
