# Playback
hwdec=auto-safe                 # hardware decoding: smoother, saves battery
profile=high-quality            # better scaling; remove if the laptop struggles
keep-open=yes                   # stay open at the end instead of closing
save-position-on-quit=yes       # resume where you left off

# Window (awesome manages it, so no title bar)
border=no
autofit-larger=90%x90%          # never open bigger than the screen

# Subtitles
slang=en,eng
sub-auto=fuzzy                  # load subs whose filename roughly matches

# Screenshots
screenshot-directory=~/imgs/screenshots
screenshot-format=png

# yt-dlp: cap at 1080p so streams don't waste bandwidth on a laptop screen
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# Play bar: ModernZ (scripts/modernz.lua) replaces the built-in one
osc=no
watch-later-options-remove=sub-pos   # ModernZ: stops resumed videos misplacing subs

# Gruvbox on-screen text
osd-color="#ebdbb2"
osd-border-color="#1d2021"
